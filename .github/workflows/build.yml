name: Build BlazeLauncher.exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x64
      - run: pip install pyinstaller==5.13.2
      - run: pyinstaller --onefile --windowed --icon icon.ico --add-data "icon.ico;." --name BlazeLauncher launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: BlazeLauncher-exe
          path: dist/BlazeLauncher.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/BlazeLauncher.exe
